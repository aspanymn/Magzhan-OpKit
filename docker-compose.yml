services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: opkit_user
      POSTGRES_PASSWORD: opkit_password
      POSTGRES_DB: opkit_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - opkit-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - opkit-network

volumes:
  postgres_data:

networks:
  opkit-network:
    driver: bridge
